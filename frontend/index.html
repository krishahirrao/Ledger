<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger — a todo list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="page">
    <header class="masthead">
      <div class="masthead-top">
        <h1 class="wordmark">Ledger</h1>
        <span class="dateline" id="dateline"></span>
      </div>
      <p class="tagline">A running account of what's left to do.</p>
    </header>

    <main class="sheet">
      <form id="todo-form" class="entry-form" autocomplete="off">
        <div class="entry-row">
          <input
            type="text"
            id="title-input"
            class="entry-title"
            placeholder="Add an entry…"
            maxlength="120"
            required
          />
          <button type="submit" class="btn-add" aria-label="Add task">
            <span>Add</span>
          </button>
        </div>
        <input
          type="text"
          id="description-input"
          class="entry-desc"
          placeholder="Details (optional)"
          maxlength="280"
        />
        <p class="form-error" id="form-error" role="alert"></p>
      </form>

      <div class="ledger-controls">
        <div class="filter-tabs" id="filter-tabs" role="tablist">
          <button class="filter-tab is-active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-tab" data-filter="open" role="tab" aria-selected="false">Open</button>
          <button class="filter-tab" data-filter="done" role="tab" aria-selected="false">Done</button>
        </div>
        <span class="tally" id="tally">0 open</span>
      </div>

      <ul class="ledger-list" id="todo-list" aria-live="polite"></ul>

      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-mark">—</p>
        <p class="empty-text">Nothing here yet. The page is waiting for its first line.</p>
      </div>

      <div class="error-state" id="error-state" hidden>
        <p>Couldn't reach the server. <button id="retry-btn" class="link-btn">Try again</button></p>
      </div>
    </main>

    <footer class="colophon">
      <span id="server-status" class="status-dot" title="Checking connection…"></span>
      <span id="server-status-text">Connecting…</span>
    </footer>
  </div>

  <!-- Edit dialog -->
  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2 class="edit-heading">Edit entry</h2>
      <label class="edit-label" for="edit-title">Title</label>
      <input type="text" id="edit-title" class="edit-input" maxlength="120" required />
      <label class="edit-label" for="edit-description">Details</label>
      <textarea id="edit-description" class="edit-textarea" maxlength="280" rows="3"></textarea>
      <p class="form-error" id="edit-form-error" role="alert"></p>
      <div class="edit-actions">
        <button type="button" id="edit-cancel" class="btn-ghost">Cancel</button>
        <button type="submit" id="edit-save" class="btn-add">Save changes</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
